[package]
name = "firewing"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Fail-closed native runtime research for Qwen3.8-Flash-Next"

[dependencies]
libc = "0.2.175"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokenizers = { version = "0.23.0", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
